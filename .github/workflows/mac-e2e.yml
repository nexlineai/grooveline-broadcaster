# Broadcaster checks on GitHub's own Macs (29 Oct 2026), so Mac fixes are tested without a dual-boot round.
# The e2e builds this runner's app and runs a video show to a local MediaMTX while the window is hidden.
# Discovery (test/mac/discover.sh) ran on 29 Oct; results in the vault. No secrets, read-only token, nothing published.
name: mac-e2e

on:
  workflow_dispatch:
  push:
    branches: [main, mac-e2e]

permissions:
  contents: read

concurrency:
  group: mac-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
        # The baseline (1.6.1's src/, must fail) runs only on the test branch, so main stays a plain regression gate.
        variant: ${{ fromJSON(github.ref == 'refs/heads/main' && '["fix"]' || '["fix","baseline"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Bundle sox + ffmpeg (pinned and checksummed)
        run: scripts/mac-deps.sh
      - run: npm ci --no-audit --no-fund
      - name: Video show with the window minimized, hidden and on another Space
        run: test/mac/e2e.sh
        env:
          VARIANT: ${{ matrix.variant }}

  # Native Apple Silicon ffmpeg + sox for the arm64 app: proof they are arm64-only, system-libraries-only, have what
  # the app uses, and that sox records from CoreAudio. Hosting them for mac-deps.sh is Zé's call.
  arm64-tools:
    if: github.ref != 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Native ffmpeg 9.0.2 + sox 14.4.2 (pinned, checksummed, system libraries only)
        run: scripts/mac-tools-arm64.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac-tools-arm64
          path: ${{ runner.temp }}/arm64-tools/out/
          if-no-files-found: error
          retention-days: 7

# Grooveline Broadcaster: unsigned test builds for macOS, Windows and Linux (21 Oct 2026).
#
# No secrets, read-only token, artifacts only. Nothing here publishes to the site.
# Signed + notarized Mac releases will be a separate workflow whose signing job is gated by
# the `mac-release` environment (maintainer approval, v* tags). Never add repo-level secrets.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Bundle sox + ffmpeg (pinned and checksummed)
        run: scripts/mac-deps.sh
      - run: npm ci --no-audit --no-fund
      - name: Build both dmgs (unsigned)
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test (Rosetta, bundled tools, app launch)
        run: scripts/mac-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: broadcaster-mac-unsigned
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Bundle ffmpeg (gyan.dev 9.0.2 essentials, pinned and checksummed)
        shell: pwsh
        run: |
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip'
          $sha = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          Invoke-WebRequest $url -OutFile ff.zip
          if ((Get-FileHash ff.zip -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw 'ffmpeg checksum mismatch' }
          Expand-Archive ff.zip -DestinationPath fftmp
          New-Item -ItemType Directory -Force bin/win | Out-Null
          Copy-Item (Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin/win/ffmpeg.exe
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: broadcaster-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: broadcaster-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7
